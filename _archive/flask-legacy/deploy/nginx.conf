# 放到 /etc/nginx/sites-available/impeccable，然后 ln -s 到 sites-enabled/
# 先用 HTTP 跑通，再 certbot --nginx -d your.domain 自动改写为 HTTPS。

upstream impeccable_app {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 80;
    server_name your.domain;

    # 上传图片可能比较大
    client_max_body_size 20m;
    client_body_timeout 120s;

    access_log /var/log/nginx/impeccable.access.log;
    error_log  /var/log/nginx/impeccable.error.log;

    # 微信支付回调：必须保留原始 body 给签名校验
    location = /api/payments/wechat/notify {
        proxy_pass http://impeccable_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 30s;
    }

    # 静态资源 Nginx 直接发，不走 Flask
    location /static/ {
        alias /opt/impeccable/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        proxy_pass http://impeccable_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 生图很慢，给足超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
