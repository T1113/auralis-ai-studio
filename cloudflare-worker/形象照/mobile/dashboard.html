<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fdfdff">
    <title>控制台 · Auralis 曜临</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/system.css">
    <link rel="stylesheet" href="./_mobile.css">

    <style>
        .user-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: var(--color-brand-primary);
            color: var(--color-text-inverse);
            border-radius: var(--radius-lg);
        }
        .user-card__avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--color-surface-pure);
            color: var(--color-text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: var(--weight-semibold);
            flex: 0 0 48px;
        }
        .user-card__name {
            font-size: 16px;
            font-weight: var(--weight-semibold);
            margin-bottom: 2px;
        }
        .user-card__email {
            font-size: 12.5px;
            color: rgba(252, 252, 253, 0.7);
        }
        .user-card__credits {
            text-align: right;
        }
        .user-card__credits strong {
            font-size: 22px;
            font-weight: var(--weight-semibold);
            display: block;
            line-height: 1;
        }
        .user-card__credits small {
            font-size: 11px;
            color: rgba(252, 252, 253, 0.7);
        }

        .quick-cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 16px;
            background: var(--color-surface-pure);
            border: 1px solid var(--color-border-strong);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            font-size: 15px;
            font-weight: var(--weight-medium);
            text-decoration: none;
        }
        .quick-cta--primary {
            background: var(--color-brand-primary);
            color: var(--color-text-inverse);
            border-color: var(--color-brand-primary);
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .action-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            background: var(--color-surface-subtle);
            border-radius: var(--radius-md);
            text-decoration: none;
            color: var(--color-text-primary);
            border: 1px solid transparent;
        }
        .action-card:active {
            background: var(--color-surface-elevated);
        }
        .action-card__icon {
            font-size: 22px;
        }
        .action-card__title {
            font-size: 14.5px;
            font-weight: var(--weight-semibold);
        }
        .action-card__desc {
            font-size: 12px;
            color: var(--color-text-secondary);
            line-height: 1.4;
        }

        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .recent-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: var(--color-surface-pure);
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--radius-md);
            text-decoration: none;
            color: inherit;
        }
        .recent-item__thumb {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-sm);
            background-color: var(--color-surface-subtle);
            background-size: cover;
            background-position: center;
            flex: 0 0 56px;
        }
        .recent-item__body {
            flex: 1;
            min-width: 0;
        }
        .recent-item__title {
            font-size: 14px;
            font-weight: var(--weight-semibold);
            color: var(--color-text-primary);
            margin-bottom: 2px;
        }
        .recent-item__meta {
            font-size: 12px;
            color: var(--color-text-tertiary);
        }
        .recent-item__tag {
            display: inline-block;
            font-size: 11px;
            font-weight: var(--weight-medium);
            padding: 2px 8px;
            border-radius: var(--radius-full);
            background: var(--color-surface-elevated);
            color: var(--color-text-secondary);
        }
        .recent-item__tag--locked {
            background: rgba(182, 74, 58, 0.12);
            color: var(--color-status-error);
        }
        .recent-item__tag--ok {
            background: rgba(33, 138, 88, 0.12);
            color: var(--color-status-success);
        }

        .empty {
            text-align: center;
            padding: 28px 16px;
            background: var(--color-surface-subtle);
            border-radius: var(--radius-md);
            color: var(--color-text-secondary);
            font-size: 13.5px;
        }

        .logout-row {
            margin-top: 24px;
            text-align: center;
        }
        .logout-link {
            display: inline-block;
            padding: 10px;
            color: var(--color-status-error);
            font-size: 13.5px;
            font-weight: var(--weight-medium);
        }
    </style>
</head>
<body>
    <div class="m-page">
        <header class="m-header">
            <a href="./index.html" class="m-header__logo">
                Auralis<small>曜临</small>
            </a>
            <a href="../dashboard_settings.html" class="m-icon-btn" aria-label="设置">⚙</a>
        </header>

        <main class="m-content m-content--no-cta">
            <section class="m-section" style="padding-top: 8px;">
                <div class="user-card">
                    <div class="user-card__avatar" id="avatar">U</div>
                    <div style="flex:1; min-width:0;">
                        <div class="user-card__name" id="user-name">加载中…</div>
                        <div class="user-card__email" id="user-email">—</div>
                    </div>
                    <div class="user-card__credits">
                        <strong id="user-credits">—</strong>
                        <small>剩余次数</small>
                    </div>
                </div>
            </section>

            <section class="m-section">
                <a href="./upload.html" class="quick-cta quick-cta--primary">📷 立即生成形象照</a>
            </section>

            <section class="m-section">
                <div class="m-section__title">快捷操作</div>
                <div class="action-grid">
                    <a href="../dashboard_assets.html" class="action-card">
                        <div class="action-card__icon">📁</div>
                        <div class="action-card__title">资产与订单</div>
                        <div class="action-card__desc">已生成的批次</div>
                    </a>
                    <a href="../dashboard_settings.html" class="action-card">
                        <div class="action-card__icon">⚙️</div>
                        <div class="action-card__title">账户设置</div>
                        <div class="action-card__desc">资料、邮箱</div>
                    </a>
                    <a href="../dashboard_privacy.html" class="action-card">
                        <div class="action-card__icon">🔒</div>
                        <div class="action-card__title">隐私</div>
                        <div class="action-card__desc">数据导出与删除</div>
                    </a>
                    <a href="../support.html" class="action-card">
                        <div class="action-card__icon">💬</div>
                        <div class="action-card__title">联系客服</div>
                        <div class="action-card__desc">工单 / 邮箱</div>
                    </a>
                </div>
            </section>

            <section class="m-section">
                <div class="m-section__title">最近生成</div>
                <div class="recent-list" id="recent-list"></div>
                <div class="empty" id="empty" hidden>还没有生成记录。</div>
            </section>

            <div class="logout-row">
                <a href="#" class="logout-link" id="logout">退出登录</a>
            </div>
        </main>
    </div>

    <script src="../assets/js/app.js"></script>
    <script>
        const showToast = (m, t) => window.ImpeccableApp && window.ImpeccableApp.showToast
            ? window.ImpeccableApp.showToast(m, t) : alert(m);

        document.getElementById('logout').addEventListener('click', e => {
            e.preventDefault();
            window.ImpeccableApp.logout('./index.html');
        });

        function fmtTime(ts) {
            if (window.ImpeccableApp && window.ImpeccableApp.formatDateTime) {
                return window.ImpeccableApp.formatDateTime(ts);
            }
            try { return new Date(ts).toLocaleString('zh-CN'); } catch { return ''; }
        }

        async function load() {
            const session = await window.ImpeccableApp.requireAuth('./login.html');
            if (!session || !session.authenticated) return;
            const user = session.user || {};
            const name = user.name || user.email || '用户';
            const initial = (name.trim().charAt(0) || 'U').toUpperCase();
            document.getElementById('avatar').textContent = initial;
            document.getElementById('user-name').textContent = name;
            document.getElementById('user-email').textContent = user.email || '';
            document.getElementById('user-credits').textContent =
                typeof user.credits === 'number' ? user.credits : '—';

            try {
                const response = await window.ImpeccableApp.apiFetch('/api/jobs');
                const jobs = response.jobs || [];
                renderJobs(jobs.slice(0, 5));
            } catch (err) {
                showToast(err.message || '加载历史失败', 'error');
            }
        }

        function renderJobs(jobs) {
            const list = document.getElementById('recent-list');
            const empty = document.getElementById('empty');
            list.innerHTML = '';
            if (!jobs.length) {
                empty.hidden = false;
                return;
            }
            empty.hidden = true;
            jobs.forEach(j => {
                const a = document.createElement('a');
                a.className = 'recent-item';
                a.href = './result.html?batchId=' + encodeURIComponent(j.id);
                const isUnlocked = j.status === 'unlocked';
                a.innerHTML = `
                    <div class="recent-item__thumb" style="background-image:url('${j.coverImageUrl || ''}')"></div>
                    <div class="recent-item__body">
                        <div class="recent-item__title">形象档案批次</div>
                        <div class="recent-item__meta">${fmtTime(j.createdAt)}</div>
                    </div>
                    <span class="recent-item__tag ${isUnlocked ? 'recent-item__tag--ok' : 'recent-item__tag--locked'}">
                        ${isUnlocked ? '已解锁' : '待支付'}
                    </span>
                `;
                list.appendChild(a);
            });
        }

        document.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
