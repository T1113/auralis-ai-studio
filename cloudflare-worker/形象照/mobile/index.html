<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fdfdff">
    <title>Auralis 曜临 · AI 职业形象照</title>
    <meta name="description" content="几张自拍，快速生成专业形象照。">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/system.css">
    <link rel="stylesheet" href="./_mobile.css">

    <style>
        /* Page-specific styles for the mobile landing */
        .hero {
            padding: 24px 0 8px;
        }
        .hero__eyebrow {
            margin-bottom: 16px;
        }
        .hero__title {
            margin-bottom: 12px;
        }
        .hero__sub {
            color: var(--color-text-secondary);
            font-size: 15px;
            line-height: 1.55;
            margin-bottom: 20px;
        }
        .hero__cta {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hero__samples {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .hero__samples img {
            width: 100%;
            aspect-ratio: 4/5;
            object-fit: cover;
            border-radius: var(--radius-md);
            background: var(--color-surface-subtle);
        }

        .steps {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .step {
            display: flex;
            gap: 14px;
            padding: 14px;
            background: var(--color-surface-subtle);
            border-radius: var(--radius-lg);
        }
        .step__num {
            flex: 0 0 28px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--color-brand-primary);
            color: var(--color-text-inverse);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: var(--weight-semibold);
            margin-top: 1px;
        }
        .step__title {
            font-size: 15px;
            font-weight: var(--weight-semibold);
            color: var(--color-text-primary);
            margin-bottom: 2px;
        }
        .step__desc {
            font-size: 13.5px;
            color: var(--color-text-secondary);
            line-height: 1.5;
        }

        .trust {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .trust__item {
            text-align: center;
            padding: 14px 8px;
            background: var(--color-surface-subtle);
            border-radius: var(--radius-md);
        }
        .trust__icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .trust__label {
            font-size: 11.5px;
            color: var(--color-text-secondary);
            font-weight: var(--weight-medium);
            line-height: 1.3;
        }

        .price-card {
            padding: 20px 18px;
            background: var(--color-brand-primary);
            color: var(--color-text-inverse);
            border-radius: var(--radius-lg);
        }
        .price-card__label {
            font-size: 12px;
            color: rgba(252,252,253,0.7);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        .price-card__amount {
            font-size: 28px;
            font-weight: var(--weight-semibold);
            margin-bottom: 4px;
        }
        .price-card__sub {
            font-size: 13px;
            color: rgba(252,252,253,0.75);
            margin-bottom: 14px;
        }
        .price-card .m-btn {
            background: var(--color-surface-pure);
            color: var(--color-text-primary);
        }

        .footer {
            padding: 28px 0;
            color: var(--color-text-tertiary);
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }
        .footer__links {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .footer__links a { color: var(--color-text-secondary); }
    </style>
</head>
<body>
    <div class="m-page">
        <header class="m-header">
            <a href="./index.html" class="m-header__logo">
                Auralis<small>曜临</small>
            </a>
            <div class="m-header__actions">
                <a href="./login.html" id="nav-login-btn" class="m-icon-btn" style="font-size:14px; padding:0 14px; width:auto;" data-i18n="nav_login">登录</a>
            </div>
        </header>

        <main class="m-content m-content--no-cta">
            <!-- HERO -->
            <section class="hero">
                <div class="hero__eyebrow">
                    <span class="m-pill">
                        <span class="m-pill__dot"></span>
                        端到端加密 · 不用于训练 · 微信支付
                    </span>
                </div>
                <h1 class="m-h1 hero__title" data-i18n="hero_title">几张自拍，快速生成专业形象照</h1>
                <p class="hero__sub" data-i18n="hero_subtitle">不再为了找影楼、选服装、反复拍摄而烦恼。仅需三步，即可将自拍转换为专业级职场头像。</p>

                <div class="hero__cta">
                    <a href="#" onclick="handleGenerateClick(event)" class="m-btn m-btn--primary m-btn--block" data-i18n="btn_start">立即开始生成</a>
                    <a href="../gallery.html" class="m-btn m-btn--ghost m-btn--block">查看案例展示</a>
                </div>

                <div class="hero__samples" aria-hidden="true">
                    <img src="../assets/showcase/pro-headshot.jpg" alt="">
                    <img src="../assets/showcase/source-selfie.jpg" alt="">
                </div>
            </section>

            <!-- 3-STEP -->
            <section class="m-section">
                <h2 class="m-h2" style="margin-bottom:14px;">三步生成</h2>
                <div class="steps">
                    <div class="step">
                        <span class="step__num">1</span>
                        <div>
                            <div class="step__title">上传 3-5 张自拍</div>
                            <div class="step__desc">清晰正脸照，光线均匀即可。</div>
                        </div>
                    </div>
                    <div class="step">
                        <span class="step__num">2</span>
                        <div>
                            <div class="step__title">AI 自动生成</div>
                            <div class="step__desc">无需选服装、不用约影楼，几分钟出图。</div>
                        </div>
                    </div>
                    <div class="step">
                        <span class="step__num">3</span>
                        <div>
                            <div class="step__title">下载使用</div>
                            <div class="step__desc">领英、简历、官网、签证一图全用。</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- TRUST -->
            <section class="m-section">
                <h2 class="m-h2" style="margin-bottom:14px;">放心使用</h2>
                <div class="trust">
                    <div class="trust__item">
                        <div class="trust__icon">🔒</div>
                        <div class="trust__label">端到端加密</div>
                    </div>
                    <div class="trust__item">
                        <div class="trust__icon">🚫</div>
                        <div class="trust__label">不用于训练</div>
                    </div>
                    <div class="trust__item">
                        <div class="trust__icon">💳</div>
                        <div class="trust__label">微信支付</div>
                    </div>
                </div>
            </section>

            <!-- PRICE -->
            <section class="m-section">
                <div class="price-card">
                    <div class="price-card__label">个人套餐</div>
                    <div class="price-card__amount">¥99</div>
                    <div class="price-card__sub">一次生成 · 多张可选 · 永久保存</div>
                    <a href="#" onclick="handleGenerateClick(event)" class="m-btn m-btn--block">立即开始</a>
                </div>
            </section>

            <!-- FOOTER -->
            <footer class="footer">
                <div class="footer__links">
                    <a href="../faq.html">常见问题</a>
                    <a href="../enterprise.html">企业版</a>
                    <a href="../privacy.html">隐私</a>
                    <a href="../terms.html">条款</a>
                    <a href="../support.html">客服</a>
                </div>
                <div>© 2026 Auralis 曜临</div>
            </footer>
        </main>
    </div>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script>
        function renderAuthenticatedNav(user) {
            const loginBtn = document.getElementById('nav-login-btn');
            if (!loginBtn || !user) return;
            const initial = (user.name || user.email || 'U').trim().charAt(0).toUpperCase();
            loginBtn.href = './dashboard.html';
            loginBtn.removeAttribute('data-i18n');
            loginBtn.setAttribute('aria-label', '进入控制台');
            loginBtn.textContent = initial;
            loginBtn.style.cssText = 'width:36px;height:36px;padding:0;background:var(--color-brand-primary);color:var(--color-text-inverse);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.ImpeccableApp && window.ImpeccableApp.syncSession) {
                const session = await window.ImpeccableApp.syncSession();
                if (session.authenticated) renderAuthenticatedNav(session.user);
            }
        });

        async function handleGenerateClick(e) {
            e.preventDefault();
            if (!window.ImpeccableApp || !window.ImpeccableApp.syncSession) {
                window.location.href = './login.html';
                return;
            }
            const session = await window.ImpeccableApp.syncSession();
            window.location.href = session.authenticated ? './upload.html' : './login.html';
        }
    </script>
</body>
</html>
