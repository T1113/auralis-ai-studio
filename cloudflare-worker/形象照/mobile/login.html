<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fdfdff">
    <title>登录 · Auralis 曜临</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/system.css">
    <link rel="stylesheet" href="./_mobile.css">

    <style>
        .auth-tabs {
            display: flex;
            background: var(--color-surface-elevated);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 20px;
        }
        .auth-tab {
            flex: 1;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: var(--weight-medium);
            color: var(--color-text-secondary);
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .auth-tab.is-active {
            background: var(--color-surface-pure);
            color: var(--color-text-primary);
            box-shadow: var(--shadow-sm);
        }
        .auth-pane { display: none; }
        .auth-pane.is-active { display: block; }

        .auth-intro {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-intro__title {
            font-size: 22px;
            font-weight: var(--weight-semibold);
            margin-bottom: 6px;
        }
        .auth-intro__sub {
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            background: var(--color-surface-pure);
            border: 1px solid var(--color-border-strong);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            font-size: 15px;
            font-weight: var(--weight-medium);
            text-decoration: none;
        }
        .google-btn:active { background: var(--color-surface-subtle); }

        .auth-fineprint {
            margin-top: 18px;
            font-size: 12px;
            color: var(--color-text-tertiary);
            text-align: center;
            line-height: 1.5;
        }
        .auth-fineprint a { color: var(--color-text-secondary); text-decoration: underline; }
    </style>
</head>
<body>
    <div class="m-page">
        <header class="m-header">
            <a href="./index.html" class="m-header__back" aria-label="返回">‹</a>
            <span class="m-header__title">账户</span>
            <span style="width:44px"></span>
        </header>

        <main class="m-content m-content--no-cta">
            <div class="auth-intro">
                <div class="auth-intro__title">欢迎来到 Auralis 曜临</div>
                <div class="auth-intro__sub">登录后即可生成你的专业形象照</div>
            </div>

            <div class="auth-tabs" role="tablist">
                <button class="auth-tab is-active" id="tab-login" role="tab" aria-selected="true">登录</button>
                <button class="auth-tab" id="tab-register" role="tab" aria-selected="false">注册</button>
            </div>

            <!-- Login -->
            <section class="auth-pane is-active" id="pane-login">
                <form id="login-form" class="m-stack-12" novalidate>
                    <div>
                        <label class="m-label" for="login-email">邮箱</label>
                        <input class="m-input" type="email" id="login-email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
                    </div>
                    <div>
                        <label class="m-label" for="login-pswd">密码</label>
                        <input class="m-input" type="password" id="login-pswd" autocomplete="current-password" required placeholder="至少 8 位">
                    </div>
                    <button type="submit" class="m-btn m-btn--primary m-btn--block" style="margin-top:8px;">登录</button>
                </form>

                <div class="m-divider" style="margin: 20px 0;">或</div>

                <a href="/api/auth/google/login" class="google-btn">
                    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                      <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
                      <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.8.54-1.83.87-3.05.87-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
                      <path fill="#FBBC05" d="M3.96 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"/>
                      <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
                    </svg>
                    使用 Google 继续
                </a>

                <p class="auth-fineprint">
                    登录即表示你同意我们的
                    <a href="../terms.html">服务条款</a> 与 <a href="../privacy.html">隐私政策</a>
                </p>
            </section>

            <!-- Register -->
            <section class="auth-pane" id="pane-register">
                <form id="register-form" class="m-stack-12" novalidate>
                    <div>
                        <label class="m-label" for="reg-name">姓名</label>
                        <input class="m-input" type="text" id="reg-name" required maxlength="40" placeholder="如何称呼你">
                    </div>
                    <div>
                        <label class="m-label" for="reg-email">邮箱</label>
                        <input class="m-input" type="email" id="reg-email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
                    </div>
                    <div>
                        <label class="m-label" for="reg-password">密码</label>
                        <input class="m-input" type="password" id="reg-password" autocomplete="new-password" required minlength="8" placeholder="至少 8 位，含大小写与数字">
                    </div>
                    <div>
                        <label class="m-label" for="reg-password-confirm">再次输入密码</label>
                        <input class="m-input" type="password" id="reg-password-confirm" autocomplete="new-password" required minlength="8" placeholder="再次输入">
                    </div>
                    <button type="submit" class="m-btn m-btn--primary m-btn--block" style="margin-top:8px;">创建账户</button>
                </form>

                <div class="m-divider" style="margin: 20px 0;">或</div>

                <a href="/api/auth/google/login" class="google-btn">
                    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                      <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
                      <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.8.54-1.83.87-3.05.87-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
                      <path fill="#FBBC05" d="M3.96 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"/>
                      <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
                    </svg>
                    使用 Google 注册
                </a>

                <p class="auth-fineprint">
                    注册即表示你同意我们的
                    <a href="../terms.html">服务条款</a> 与 <a href="../privacy.html">隐私政策</a>
                </p>
            </section>
        </main>
    </div>

    <script src="../assets/js/app.js"></script>
    <script>
        const tabLogin = document.getElementById('tab-login');
        const tabReg = document.getElementById('tab-register');
        const paneLogin = document.getElementById('pane-login');
        const paneReg = document.getElementById('pane-register');

        function switchTab(which) {
            const isLogin = which === 'login';
            tabLogin.classList.toggle('is-active', isLogin);
            tabReg.classList.toggle('is-active', !isLogin);
            tabLogin.setAttribute('aria-selected', isLogin);
            tabReg.setAttribute('aria-selected', !isLogin);
            paneLogin.classList.toggle('is-active', isLogin);
            paneReg.classList.toggle('is-active', !isLogin);
        }
        tabLogin.addEventListener('click', () => switchTab('login'));
        tabReg.addEventListener('click', () => switchTab('register'));

        const showToast = (msg, type) => {
            if (window.ImpeccableApp && window.ImpeccableApp.showToast) {
                window.ImpeccableApp.showToast(msg, type);
            } else {
                alert(msg);
            }
        };

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.submitter;
            const origText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '正在登录…';
            try {
                const session = await window.ImpeccableApp.apiFetch('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: document.getElementById('login-email').value.trim(),
                        password: document.getElementById('login-pswd').value
                    })
                });
                window.ImpeccableApp.persistLocalUser(session);
                showToast('登录成功，正在进入…', 'success');
                setTimeout(() => { window.location.href = './upload.html'; }, 500);
            } catch (err) {
                btn.disabled = false;
                btn.textContent = origText;
                showToast(err.message || '登录失败，请稍后再试。', 'error');
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-password-confirm').value;
            if (password.length < 8) {
                showToast('密码至少 8 位。', 'error');
                return;
            }
            if (password !== confirm) {
                showToast('两次密码不一致。', 'error');
                return;
            }
            const btn = e.submitter;
            const origText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '正在创建账户…';
            try {
                const session = await window.ImpeccableApp.apiFetch('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        name: document.getElementById('reg-name').value.trim(),
                        email: document.getElementById('reg-email').value.trim(),
                        password
                    })
                });
                window.ImpeccableApp.persistLocalUser(session);
                showToast('账户创建成功！', 'success');
                setTimeout(() => { window.location.href = './upload.html'; }, 500);
            } catch (err) {
                btn.disabled = false;
                btn.textContent = origText;
                showToast(err.message || '注册失败，请稍后再试。', 'error');
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.ImpeccableApp && window.ImpeccableApp.syncSession) {
                const session = await window.ImpeccableApp.syncSession();
                if (session.authenticated) {
                    window.location.href = './dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
